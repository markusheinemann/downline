name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          go-version: 1.27

      - name: Quality
        run: make check-quality

      - name: Test
        run: make test

      - name: Check coverage
        run: make coverage-check

      - name: Fail on unformatted code or untidy go.mod
        run: git diff --exit-code

      - name: Build
        run: make build
